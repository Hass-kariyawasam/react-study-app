<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background: Dark Blue Circle to match app theme -->
  <circle cx="50" cy="50" r="50" fill="#0F172A"/>
  
  <!-- React Atom Rings (Cyan) -->
  <g stroke="#61DAFB" stroke-width="3" opacity="0.9">
    <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(30 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(150 50 50)"/>
  </g>

  <!-- Center Icon: Graduation Cap + Book (Education) -->
  <g transform="translate(28, 32) scale(0.9)">
    <!-- Graduation Cap Top -->
    <path d="M25 5 L45 15 L25 25 L5 15 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <!-- Tassel -->
    <path d="M45 15 V25" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="45" cy="27" r="2" fill="#F59E0B"/>
    
    <!-- Open Book Shape at bottom -->
    <path d="M10 25 V40 C10 40 18 42 25 40 C32 42 40 40 40 40 V25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 40 V28" stroke="#61DAFB" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>